name: Release

# Cutting a release is pushing a tag. Everything else follows from that, so there is one
# place where a version is decided rather than a tag, a workflow input and a file that can
# disagree with each other.
#
# workflow_dispatch builds the same artifacts without publishing anything, which is how to
# find out that a build is broken before a tag exists claiming otherwise.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read is what checkout needs and all any job here needs by default. The one job that
# writes — `release`, which creates the GitHub release — declares `contents: write` for
# itself and always did, so granting it to everybody bought nothing and cost a great deal:
# actions/checkout leaves the token where git will use it for the whole job, so `test`
# handed repository write to every package `dotnet test` restores. One of those could push a
# v* tag and originate a release from source of its choosing.
#
# Deliberately not naming where it leaves it: it was an http.extraheader in .git/config, and
# checkout v6 moved it to a file of its own. The reason survives either arrangement, and a
# comment naming the mechanism would now be describing one that is gone.
#
# Not `{}`: this repository is private, so a checkout with no permissions cannot clone it.
permissions:
  contents: read

# No DOTNET_VERSION here, deliberately. Every setup-dotnet below reads global.json, so the
# SDK is decided in one file rather than in a workflow variable and a file free to disagree
# — the same rule the version itself follows.
#
# It said '10.0.x', which meant the latest 10.0 the installer could find: a runner took
# 10.0.400 while global.json named 10.0.302, and since the SDK's implicit package references
# move with it, restore in locked mode refused the build outright. A floating SDK and a lock
# file cannot both be right.
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Nothing is published until this passes. A release that fails its own test suite is
  # worse than a late one, and it is the only gate between a tag and something people
  # download.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet test tests/Cairn.Core.Tests/Cairn.Core.Tests.csproj -c Release

      # Run through the built dll rather than `dotnet test`: this suite is xunit v3 with
      # Avalonia's headless backend, which needs no display but does want its own runner.
      - run: dotnet build tests/Cairn.App.Tests -c Release
      - run: dotnet tests/Cairn.App.Tests/bin/Release/net10.0/Cairn.App.Tests.dll

  macos:
    needs: test
    runs-on: macos-latest

    # No job-level env here, deliberately. These were lifted to the job so the steps below
    # could test them in `if`, because a step's own env is not visible to that step's
    # condition — but the cost was that every step ran with a Developer ID private key and
    # an App Store Connect notary key in its environment, including `Build the app
    # bundles`, which runs `dotnet publish` and so executes MSBuild tasks and build targets
    # out of every restored NuGet package. Those are arbitrary code by design; reading
    # $CERTIFICATE needs no injection and no exploit. Both keys sign anything, not just
    # Cairn, and revoking a Developer ID is a manual conversation with Apple.
    #
    # What the conditions test now is a step output from `Check the signing configuration`,
    # which is visible to `if` and says the same thing without the secret being anywhere
    # near the step that asks.

    outputs:
      notarised: ${{ steps.notarise.outputs.done }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # On a tag this is the tag. On a manual run there is no version to speak of, and
      # GITHUB_REF_NAME is the branch — which is how a dispatch build ended up stamping
      # CFBundleShortVersionString as "main".
      - name: Work out the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *)           version="0.0.0-$(git rev-parse --short HEAD)" ;;
          esac

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # Before the build, because every way of getting this wrong otherwise costs a full
      # build first and then fails somewhere that does not name the missing secret.
      #
      # Nothing configured is a valid answer — that is the ad-hoc path. Half-configured is
      # not: it means somebody meant to sign, and finding out from a Gatekeeper dialog
      # weeks later is the worst place to learn it did not happen.
      - name: Check the signing configuration
        id: config
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          missing() { echo "  missing: $1"; FAILED=1; }
          FAILED=0

          have_cert=0
          [ -n "$CERTIFICATE" ] || [ -n "$CERTIFICATE_PASSWORD" ] && have_cert=1

          have_notary=0
          [ -n "$NOTARY_KEY" ] || [ -n "$NOTARY_KEY_ID" ] || [ -n "$NOTARY_ISSUER" ] && have_notary=1

          # Written before the branches below, both of which can leave early. These are
          # what the later steps' `if` conditions read instead of the secrets themselves,
          # and a step that never emitted them would fail closed — which is the right
          # direction, but only if it is not also the ordinary path.
          echo "have_cert=$have_cert" >> "$GITHUB_OUTPUT"
          echo "have_notary=$have_notary" >> "$GITHUB_OUTPUT"

          if [ "$have_cert" = 0 ] && [ "$have_notary" = 0 ]; then
            echo "No signing secrets — building ad-hoc signed, as before."
            echo "The release notes will say the macOS builds are not notarised."
            exit 0
          fi

          if [ "$have_cert" = 1 ]; then
            echo "Signing configuration:"
            [ -n "$CERTIFICATE" ] || missing "MACOS_CERTIFICATE"
            [ -n "$CERTIFICATE_PASSWORD" ] || missing "MACOS_CERTIFICATE_PASSWORD"
          fi

          if [ "$have_notary" = 1 ]; then
            echo "Notarisation configuration:"
            [ -n "$NOTARY_KEY" ] || missing "APPLE_NOTARY_KEY"
            [ -n "$NOTARY_KEY_ID" ] || missing "APPLE_NOTARY_KEY_ID"
            [ -n "$NOTARY_ISSUER" ] || missing "APPLE_NOTARY_ISSUER"

            # Notarisation is Apple checking something signed with a Developer ID. There
            # is nothing to submit without one, and the notarise step would simply be
            # skipped — quietly producing the ad-hoc build the secrets were meant to avoid.
            [ "$have_cert" = 1 ] || missing "MACOS_CERTIFICATE (notarising needs a signed app)"
          fi

          if [ "$FAILED" = 1 ]; then
            echo
            echo "Set the rest, or none of them — half is the one case that cannot work."
            exit 1
          fi

          echo "  complete"

      # All of this degrades: with no certificate the build is ad-hoc signed exactly as it
      # was before any of it existed, and the release notes say so. Adding the secrets is
      # what turns signing on — no code change, no flag.
      - name: Import the signing certificate
        id: cert
        if: steps.config.outputs.have_cert == '1'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A keychain of its own, unlocked only for this job, with a password nobody needs
          # to know because nothing outlives the runner.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt that nobody is there to answer,
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')"

          [ -n "$identity" ] || { echo "no Developer ID Application identity in the p12"; exit 1; }

          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signing as: $identity"

      # A bundle rather than the bare binary: it gets a Dock icon and a real app name, it
      # avoids the self-extraction pause a single-file build has on first run, and it is
      # what carries CFBundleURLTypes — without which cairn:// links do nothing.
      #
      # Both architectures, because Intel Macs are still out there and an arm64-only
      # download simply refuses to start on one.
      # No make-icons.sh here: the rendered icons are committed, and that script exists for
      # when the artwork changes. Re-rendering on every release would make the icon a build
      # output that depends on whatever the runner's qlmanage does today.
      - name: Build the app bundles
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          ./build-macos-app.sh osx-arm64
          ./build-macos-app.sh osx-x64

      # Signing gets past "unidentified developer"; only notarisation gets past the
      # quarantine warning on a downloaded file, and only stapling makes that work for
      # somebody whose first launch is offline.
      - name: Notarise and staple
        id: notarise
        if: steps.cert.outputs.identity != '' && steps.config.outputs.have_notary == '1'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"

          for arch in arm64 x64; do
            app="artifacts/osx-$arch/Cairn.app"

            # Submitted as a zip, and ditto for the same reason it is used to package:
            # anything that flattens the bundle produces a rejection about a malformed
            # archive rather than about the app.
            ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarize-$arch.zip"

            xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" \
              --wait --timeout 30m

            # Staples the ticket into the bundle, so Gatekeeper can check it without the
            # network. Done after notarisation and before packaging, or the archive people
            # download contains an unstapled app.
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          done

          rm -f "$RUNNER_TEMP/notary.p8"
          echo "done=true" >> "$GITHUB_OUTPUT"

      # ditto, not zip. A .app contains symlinks and extended attributes, and plain zip
      # quietly flattens them into a bundle macOS then calls damaged.
      #
      # No --sequesterRsrc here, unlike the notarisation zip above. It writes AppleDouble
      # sidecars into a __MACOSX/ directory — 235 entries shadowing the bundle — which
      # Finder hides and every other unzip tool shows as a junk folder beside the app.
      # Dropping it costs nothing: same size, and the signature still verifies after a
      # round trip, which was checked rather than assumed.
      #
      # The submission zip keeps the flag deliberately. Apple has accepted that exact
      # command, and the packaging people download is not the place to find out whether
      # the notary minds a different one.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # The version this job already worked out, rather than GITHUB_REF_NAME again.
          # They agree on a tag and not otherwise: a manual run produced
          # cairn-main-macos-arm64.zip, naming the branch as though it were a version —
          # the same mistake `Work out the version` was written to stop, surviving in the
          # step that names the file. The cross job's Package says "same rule as the macOS
          # job", which was true of the rule and not of this.
          mkdir -p dist
          for arch in arm64 x64; do
            ditto -c -k --keepParent \
              "artifacts/osx-$arch/Cairn.app" \
              "dist/cairn-$VERSION-macos-$arch.zip"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          # A handoff to the publish jobs in this same run, not a copy of the release —
          # what ships lives in the GitHub release and in R2. A week is enough to re-run a
          # failed publish or pull a binary to debug one; the 90-day default kept every
          # build of every tag and was most of the account's Actions storage.
          retention-days: 7

  # Windows and Linux cross-publish from one runner: these are single-file binaries with
  # no platform tooling behind them, unlike the macOS bundle.
  cross:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: ./build-release.sh win-x64 linux-x64

      - name: Package
        run: |
          # Same rule as the macOS job: a manual run has no version, and the branch name
          # is not one.
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *)           version="0.0.0-$(git rev-parse --short HEAD)" ;;
          esac

          mkdir -p dist

          # The launcher only. cairn-cli is built above and deliberately left out: it is a
          # development tool, and shipping it puts a second program in front of people who
          # were not told it was coming and have no documentation for it.
          tar -czf "dist/cairn-$version-linux-x64.tar.gz" \
            -C artifacts/linux-x64 cairn

          # cairn-server ships, and separately, for the same reason cairn-cli does not: it
          # is documented, it is one program with one purpose, and somebody putting a
          # server in a container wants that file and not a desktop launcher. Named so the
          # manifest below reads a platform of "linux-x64-server" out of it.
          #
          # Linux only. The game publishes a dedicated server for Linux and Windows, and
          # "unit" writes systemd files — the machines people host on are Linux, and a
          # Windows binary nobody asked for is a second thing to test and explain.
          tar -czf "dist/cairn-$version-linux-x64-server.tar.gz" \
            -C artifacts/linux-x64 cairn-server

          (cd artifacts/win-x64 && zip -q "../../dist/cairn-$version-windows-x64.zip" \
            cairn.exe)

          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: cross
          path: dist/*
          retention-days: 7

  # The manifest is made and signed here, in a job that holds the signing key and no
  # credential that can write to object storage — which is the entire point of it existing
  # as a separate job. Signing beside the upload would put both keys in one place and leave
  # the signature vouching for whatever that one place decided to say.
  #
  # So the ordering is deliberate: describe the artifacts, sign the description, and only
  # then hand both to a job that can publish. A compromise of the R2 credentials can still
  # replace what people download — but not without the signature ceasing to match, which is
  # the difference between an undetectable substitution and a client that refuses.
  manifest:
    needs: [macos, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Job-level, so these replace the workflow's `contents: read` outright rather than
    # adding to it — all three have to be named or the attestation step fails on the one
    # that was left out. This job still holds no credential that can write to object
    # storage, which is what the paragraph above is about; `attestations: write` writes to
    # GitHub's attestation store and reaches nothing else.
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # What the minisign signature below cannot say.
      #
      # That signature is made with a key held by whoever cuts releases, so it answers "are
      # these the bytes that were meant to ship" and nothing else. It says nothing about
      # where they came from, and a reader who does not already trust the key holder gets
      # nothing from it at all — which is the whole question somebody reading this source
      # is asking: is the thing I downloaded built from what I just read?
      #
      # This answers that. GitHub mints a Sigstore certificate against the workflow's own
      # OIDC identity and signs a SLSA statement binding each artifact's digest to this
      # repository, this workflow file, this commit and this run. Nobody can produce one by
      # hand: not whoever holds the R2 credentials, not whoever holds the minisign key, not
      # the account owner. Only actually running this workflow on that commit produces it.
      #
      #   gh attestation verify cairn-1.2.3-linux-x64.tar.gz --repo dizzyd/cairn-app
      #
      # Public repositories only, on every plan; a private one needs Enterprise Cloud. So
      # this is skipped while the repository is private rather than failing the release —
      # and the manifest below then simply does not claim an attestation, instead of naming
      # one that was never made.
      - name: Attest what was built
        id: attest
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*.zip, dist/*.tar.gz'

      # Into dist/ under a predictable name, so it travels with the artifacts to both R2
      # and the GitHub release. Without this the provenance exists only in GitHub's
      # attestation store, which is reachable by API and not by anybody who downloaded from
      # cairns.gg — the channel people actually use. With it, verification works offline:
      #
      #   gh attestation verify cairn-1.2.3-linux-x64.tar.gz \
      #     --repo dizzyd/cairn-app --bundle cairn-1.2.3.intoto.jsonl
      - name: Keep the attestation beside the artifacts
        id: bundle
        if: steps.attest.outputs.bundle-path != ''
        run: |
          name="cairn-${GITHUB_REF_NAME#v}.intoto.jsonl"
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "attestation: $name"

      - name: Describe what was built
        env:
          ATTESTATION: ${{ steps.bundle.outputs.file }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          public="${R2_PUBLIC_URL:-$R2_ENDPOINT/$R2_BUCKET}"
          public="${public%/}"

          cd dist

          # Named explicitly rather than `*`, which would depend on whether the glob is
          # expanded before the redirection creates the file it is writing to. It is also
          # why the attestation bundle is not swept up: it vouches for these files and is
          # not one of them.
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

          {
            echo "{"
            echo "  \"version\": \"$version\","
            echo "  \"publishedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","

            # The commit these artifacts were built from, and the run that built them.
            # Both are inside the signed manifest, so a reader gets from a download to the
            # source it came from without trusting the page that linked it — and the
            # attestation below is what makes that a check rather than a claim.
            echo "  \"commit\": \"$GITHUB_SHA\","
            echo "  \"run\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\","

            # Absent rather than null when there is none, so a client can only either find
            # a bundle to verify against or find nothing — never a key promising one that
            # is not there.
            [ -n "$ATTESTATION" ] && \
              echo "  \"attestation\": \"$public/releases/$version/$ATTESTATION\","

            echo "  \"files\": ["
            first=1
            for f in *.zip *.tar.gz; do
              [ -e "$f" ] || continue
              platform="$(echo "$f" | sed -E "s/^cairn-$version-//; s/\.(zip|tar\.gz)$//")"
              [ $first = 1 ] || echo ","
              first=0
              printf '    {"platform": "%s", "name": "%s", "url": "%s", "size": %s, "sha256": "%s"}' \
                "$platform" "$f" "$public/releases/$version/$f" \
                "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "  ]"
            echo "}"
          } > manifest.json

          cat manifest.json

      # Signed with a key that exists nowhere else in this workflow. Without it the manifest
      # names both the download and the hash to check it against, so it authenticates
      # nothing: whoever rewrites one rewrites the other.
      #
      # Not configured is a valid answer and leaves things exactly as they were, in the same
      # way the macOS certificate does — but it is said out loud, because a release that
      # quietly stopped being signed while clients expected a signature is the failure worth
      # noticing early.
      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          # Optional. Unset is correct for a key with no password or an empty one; set it
          # only if the key in MINISIGN_SECRET_KEY actually has a passphrase.
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY is not set — publishing an unsigned manifest."
            echo "Clients built with a public key compiled in will refuse it."
            exit 0
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 --decode > "$key"
          trap 'rm -f "$key"' EXIT

          # The password goes in on stdin, which is the only way there is.
          #
          # minisign has no environment variable and no flag for one: it asks the terminal,
          # and falls back to stdin when there is no terminal — which is the case here.
          # That fallback is what makes this work at all, and it has one sharp edge worth
          # naming, because getting it wrong looks like a broken key rather than a broken
          # command: stdin at EOF is not an empty password. Closing it produces
          # "Password: get_password()" and exit 2, while a single newline produces
          # "Password: (empty)" and a signature. So the line below is fed even when there
          # is nothing to feed it.
          #
          # This accepts every shape of key: one made with -W, one encrypted with an empty
          # password, and one with a real password if MINISIGN_KEY_PASSWORD is set. A wrong
          # password exits 2 and writes nothing, so it fails here rather than further on.
          #
          # A password on this copy earns little: it would live beside the key as a second
          # repository secret handed to this same step, so whatever can read one can read
          # the other. It is worth having on the copy kept elsewhere. Either way this does
          # not care, which is the point — the release should not break over a choice that
          # is somebody else's to make.
          #
          # -t is the trusted comment, which the second signature covers, so it cannot be
          # edited after the fact the way the untrusted one can. Bounded, so a version that
          # someday insists on a terminal fails fast instead of holding the job open.
          printf '%s\n' "$MINISIGN_KEY_PASSWORD" | timeout 60 minisign -S \
            -s "$key" \
            -m dist/manifest.json \
            -t "cairn $GITHUB_REF_NAME" \
            -c "cairn release manifest"

          cat dist/manifest.json.minisig

      # The bundle goes with them. It is what the `attestation` field in the manifest names,
      # and the jobs that publish only ever see what is uploaded here — a manifest naming a
      # file that never left this runner would be worse than no attestation at all.
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            dist/manifest.json
            dist/manifest.json.minisig
            dist/SHA256SUMS
            dist/*.intoto.jsonl
          retention-days: 7

  # Does the R2 credential actually work — asked before a release depends on the answer.
  #
  # The r2 job below only runs on a tag, so the only way to discover a wrong key was to cut
  # a release and read the log afterwards. That is the same trap `Check the signing
  # configuration` exists to avoid, and it is worse here: the credential is the last thing
  # in the chain, so finding out costs a full build, four artifacts and a notarisation
  # round trip first.
  #
  # Manual runs only, deliberately. On a tag this would be a second thing that can fail the
  # release, and the r2 job is already written to skip and say so when the credential is
  # absent — a preflight that turned that into an error would replace a documented
  # degradation with an outage.
  #
  # Writes, reads back, compares and deletes, because each answers a different question: a
  # key can be valid and read-only, and a token scoped to the wrong bucket fails at the
  # first of those rather than at publish time. Under `_preflight/`, never `releases/`, so
  # nothing it does can be mistaken for a version — and cleaned up after, so a failure here
  # is the only thing that leaves a trace.
  r2-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}

    steps:
      - name: Round-trip an object
        if: env.R2_ACCESS_KEY_ID != ''
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"

          # The same three settings the r2 job needs, and for the reasons written there:
          # R2 has one region and the endpoint's first label is the account id, and recent
          # AWS CLI versions send integrity checksums not every S3-compatible provider
          # accepts.
          export AWS_DEFAULT_REGION=auto
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

          key="_preflight/$GITHUB_RUN_ID"
          echo "cairn r2 preflight $GITHUB_RUN_ID" > sent.txt

          echo "writing  s3://$R2_BUCKET/$key"
          aws s3 cp sent.txt "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT"

          echo "reading it back"
          aws s3 cp "s3://$R2_BUCKET/$key" got.txt --endpoint-url "$R2_ENDPOINT"

          # Compared rather than assumed: a proxy or a misrouted bucket can answer a GET
          # with something that is not what was put there, and both commands succeed.
          cmp sent.txt got.txt || { echo "what came back is not what went up"; exit 1; }

          echo "deleting it"
          aws s3 rm "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT"

          echo
          echo "R2 credential works: write, read and delete on $R2_BUCKET."

      - name: Say why nothing was checked
        if: env.R2_ACCESS_KEY_ID == ''
        run: echo "R2_ACCESS_KEY_ID is not set — nothing to check."

  # Object storage, which is where downloads actually come from — GitHub is not a public
  # distribution channel here, so this job is the one that reaches people.
  #
  # Uploading a version is safe on its own: the files sit at an immutable path that nothing
  # links to. Moving latest.json is the act that ships them, and that has a condition on it.
  r2:
    needs: [macos, cross, manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      NOTARISED: ${{ needs.macos.outputs.notarised }}

    steps:
      - uses: actions/download-artifact@v8
        if: env.R2_ACCESS_KEY_ID != ''
        with:
          path: dist
          merge-multiple: true

      - name: Upload to R2
        if: env.R2_ACCESS_KEY_ID != ''
        run: |
          version="${GITHUB_REF_NAME#v}"

          # R2 speaks S3, so the client is the AWS CLI already on the runner.
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"

          # "auto", not derived from the endpoint. R2 has one region and the endpoint's
          # first label is the account id, so deriving it — which is right for a provider
          # whose endpoint names its region — would sign requests for a region that does
          # not exist.
          export AWS_DEFAULT_REGION=auto

          # Recent AWS CLI versions add integrity checksums by default that not every
          # S3-compatible provider accepts. Asking for them only when required keeps this
          # working across CLI updates rather than breaking on one.
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

          public="${R2_PUBLIC_URL:-$R2_ENDPOINT/$R2_BUCKET}"
          public="${public%/}"

          cd dist

          # SHA256SUMS, manifest.json and manifest.json.minisig all arrive from the
          # `manifest` job. Regenerating any of them here would defeat the point: this job
          # holds the credential that can rewrite object storage, and a description it
          # wrote itself vouches for nothing. The signature travels with them, so what gets
          # published either matches what was signed or stops verifying.
          test -f manifest.json || { echo "no manifest.json from the manifest job"; exit 1; }
          cat SHA256SUMS

          # A versioned path, and never overwritten. Somebody who linked a build a year ago
          # should still get that build, byte for byte — which also means these can be
          # cached forever, since the URL cannot come to mean something else.
          # No --acl: R2 does not implement per-object ACLs, and sending one is an error
          # rather than a no-op. What makes these readable is the bucket's custom domain,
          # which is a property of the bucket and not of each file.
          for f in *; do
            aws s3 cp "$f" "s3://$R2_BUCKET/releases/$version/$f" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done


          # Kept with the version it describes, immutable like everything else under that
          # path. latest.json is overwritten every release, so without this the manifest
          # for a version stops existing the moment the next one ships — and the artifacts
          # would outlive the only record of their sizes and checksums.
          #
          # Uploaded whether or not this becomes the download: it is part of the version's
          # record, and a version nothing points at is still a version that happened.
          aws s3 cp manifest.json "s3://$R2_BUCKET/releases/$version/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"

          # Uploading a version reaches nobody; moving latest.json is what ships it. So the
          # one thing worth stopping for gets checked here rather than left to somebody
          # remembering — a macOS build that is not notarised greets its first user with
          # "Cairn is damaged", and that should not become the download by default.
          #
          # Ship anyway if that is deliberate: copy the versioned manifest over
          # latest.json, by hand, once.
          if [ "$NOTARISED" != "true" ]; then
            echo
            echo "Uploaded, but NOT promoted: the macOS builds are not notarised."
            echo "  complete and reachable:  $public/releases/$version/"
            echo "  describing it:           $public/releases/$version/manifest.json"
            echo "  unchanged:               $public/releases/latest.json"
            echo
            echo "Set the signing secrets, or promote it by hand if that is intended."
            exit 0
          fi

          # Notarisation says the build is sound. It says nothing about whether this
          # version was meant to be the download, and a tag is free to be a rehearsal or a
          # release candidate — so without this, v1.0.0-rc1 notarises like anything else
          # and hands itself to every client's update check.
          #
          # The version's shape decides it, since a hyphen is semver's prerelease marker
          # and nothing else here produces one. That also aligns with what a client would
          # do with it: GameVersions.IsPlausibleVersion refuses anything that is not a bare
          # version, so an offer of 1.0.0-rc1 is one the other end would not take anyway.
          #
          # Uploaded regardless, and reachable at its own immutable path. That is what
          # makes a rehearsal tag useful: the whole path runs, the artifacts and the
          # attestation are there to check, and the one irreversible act does not happen.
          case "$version" in
            *-*)
              echo
              echo "Uploaded, but NOT promoted: $version is a prerelease."
              echo "  complete and reachable:  $public/releases/$version/"
              echo "  describing it:           $public/releases/$version/manifest.json"
              echo "  unchanged:               $public/releases/latest.json"
              echo
              echo "Tag a bare version to ship one, or promote this by hand if that is intended."
              exit 0
              ;;
          esac

          # The same bytes at both paths rather than a pointer, so a reader needs one
          # request and cannot catch latest.json naming a manifest that is not up yet.
          # The signature first, then the document it vouches for. A reader that catches
          # the pair mid-update finds an old signature against an old manifest, which
          # verifies; the other order gives them a new manifest against an old signature,
          # which does not, and a client that refuses a good release is the worse failure.
          if [ -f manifest.json.minisig ]; then
            aws s3 cp manifest.json.minisig "s3://$R2_BUCKET/releases/latest.json.minisig" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type text/plain \
              --cache-control "public, max-age=300"
          fi

          aws s3 cp manifest.json "s3://$R2_BUCKET/releases/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=300"

          echo "published and promoted: $public/releases/$version/"

      - name: Say why nothing was uploaded
        if: env.R2_ACCESS_KEY_ID == ''
        run: echo "R2_ACCESS_KEY_ID is not set — skipping the upload to object storage."

  release:
    needs: [macos, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        env:
          NOTARISED: ${{ needs.macos.outputs.notarised }}
        run: |
          : > notes.md

          # The changelog leads, because it is the only part anybody reads for its own sake.
          # Written as the work lands rather than at the tag — by release day nobody
          # remembers which of forty commits a player would notice, and a changelog
          # assembled from commit subjects reads like one.
          #
          # Named by series (0.8.0 and 0.8.1 share docs/changelog-0.8.md), which is how the
          # file is already named. Missing is not a failure: a release with nothing worth
          # telling a player about is a real thing, and holding up a build over it would
          # only teach somebody to write an empty one.
          version="${GITHUB_REF_NAME#v}"
          series="$(echo "$version" | cut -d. -f1,2)"
          changelog="docs/changelog-$series.md"

          if [ -f "$changelog" ]; then
            echo "release notes from $changelog"
            cat "$changelog" >> notes.md
            printf '\n\n---\n\n' >> notes.md
          else
            echo "no $changelog — the notes will be the artifact list alone"
          fi

          cat >> notes.md <<'NOTES'
          Built artifacts, kept here as a record. **People download from cairns.gg** — this
          repository is not the distribution channel.

          | platform | file |
          |---|---|
          | macOS (Apple silicon) | `cairn-*-macos-arm64.zip` |
          | macOS (Intel) | `cairn-*-macos-x64.zip` |
          | Windows | `cairn-*-windows-x64.zip` |
          | Linux | `cairn-*-linux-x64.tar.gz` |
          | Linux, dedicated server | `cairn-*-linux-x64-server.tar.gz` |

          The first four are the launcher and nothing else — Cairn fetches the game and the
          .NET runtime itself.

          The last one is **not** the launcher: it is `cairn-server`, which follows a
          published pack and runs a dedicated server under systemd, for a machine with no
          screen attached. Take it only if that is what you came for.
          NOTES

          # Unconditional, because nothing here signs the Windows build: win-x64 is
          # cross-published on the Linux runner, which has no signtool. Make this
          # conditional the way the macOS block below is on the day that changes —
          # notes that claim a state the build did not produce are the failure this is
          # written to avoid.
          #
          # Worth saying even so. SmartScreen reputation attaches to the publisher
          # certificate as well as the file, so unsigned, the only thing that can earn any
          # is the exact executable — and every release is a new hash starting from zero.
          # The warning is therefore not a phase this build grows out of, and a download
          # that looks blocked with no explanation reads as a broken one.
          cat >> notes.md <<'NOTES'

          ### Windows: SmartScreen will warn on first run

          The build is not signed, so Windows shows "Windows protected your PC" and hides
          the way past it behind **More info** → **Run anyway**. It is a statement about
          the certificate, not about the file: the same download runs normally afterwards.
          NOTES

          # Said by the build rather than by whoever writes the notes, because the two
          # drift: a release that quietly stopped being notarised while still claiming to
          # be would send people past a warning they should have taken seriously.
          if [ "$NOTARISED" = "true" ]; then
            cat >> notes.md <<'NOTES'

          The macOS builds are signed and notarised, so they open normally.
          NOTES
          else
            cat >> notes.md <<'NOTES'

          ### macOS: these builds are not notarised

          They are ad-hoc signed, so Gatekeeper refuses them on first open with "Cairn is
          damaged" or "cannot be opened because the developer cannot be verified":

          ```
          xattr -dr com.apple.quarantine /Applications/Cairn.app
          ```
          NOTES
          fi

          cat notes.md

      # A second copy of the checksums, on a host the R2 credentials do not reach.
      #
      # SHA256SUMS, manifest.json and the artifacts they describe are all generated on the
      # same runner and uploaded to the same bucket over the same credentials, so every one
      # of them can be rewritten together and each check downstream still passes. That is
      # not integrity, it is a consistency check — and a single credential is all of it.
      #
      # This does not fix that, and is not pretending to: whoever holds the R2 keys can
      # still replace what people download. What it buys is detection. The same hashes now
      # exist somewhere R2 cannot write, so a substitution stops being undetectable after
      # the fact — which is the property that decides whether a compromise can be
      # investigated or only guessed at. A real fix is a detached signature over
      # manifest.json made with a key that never enters this workflow.
      - name: Record the checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

          {
            echo
            echo '### Checksums'
            echo
            echo 'Also published beside the downloads. These are recorded here as well'
            echo 'because this repository and object storage are reached by different'
            echo 'credentials, so the two copies cannot be rewritten by the same key.'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist

          # Not a draft. It was one so somebody would look before the world saw an ad-hoc
          # signed build — but nobody downloads from here: this is a record of what was
          # built and a copy of the artifacts, and the gate that matters is on promoting
          # latest.json in the spaces job, which is what people actually fetch.
          # The same rule the r2 job promotes by, applied to the other place a version can
          # claim to be the current one. GitHub marks the newest non-prerelease as "Latest
          # release" on the repository front page, so a rehearsal tag would sit there
          # announcing itself — pointing at builds the download channel deliberately did
          # not promote, which is a worse contradiction than either alone.
          prerelease=()
          case "${GITHUB_REF_NAME#v}" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            ${prerelease+"${prerelease[@]}"}
