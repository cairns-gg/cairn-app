name: Release

# Cutting a release is pushing a tag. Everything else follows from that, so there is one
# place where a version is decided rather than a tag, a workflow input and a file that can
# disagree with each other.
#
# workflow_dispatch builds the same artifacts without publishing anything, which is how to
# find out that a build is broken before a tag exists claiming otherwise.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # only the release job needs this; see its own permissions block

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Nothing is published until this passes. A release that fails its own test suite is
  # worse than a late one, and it is the only gate between a tag and something people
  # download.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet test tests/Cairn.Core.Tests/Cairn.Core.Tests.csproj -c Release

      # Run through the built dll rather than `dotnet test`: this suite is xunit v3 with
      # Avalonia's headless backend, which needs no display but does want its own runner.
      - run: dotnet build tests/Cairn.App.Tests -c Release
      - run: dotnet tests/Cairn.App.Tests/bin/Release/net10.0/Cairn.App.Tests.dll

  macos:
    needs: test
    runs-on: macos-latest

    # Lifted to the job so the steps below can test them in `if`. A step's own `env` is not
    # visible to that step's condition, which fails open — the step runs, and signing dies
    # somewhere less obvious.
    env:
      CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}

    outputs:
      notarised: ${{ steps.notarise.outputs.done }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # On a tag this is the tag. On a manual run there is no version to speak of, and
      # GITHUB_REF_NAME is the branch — which is how a dispatch build ended up stamping
      # CFBundleShortVersionString as "main".
      - name: Work out the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *)           version="0.0.0-$(git rev-parse --short HEAD)" ;;
          esac

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # Before the build, because every way of getting this wrong otherwise costs a full
      # build first and then fails somewhere that does not name the missing secret.
      #
      # Nothing configured is a valid answer — that is the ad-hoc path. Half-configured is
      # not: it means somebody meant to sign, and finding out from a Gatekeeper dialog
      # weeks later is the worst place to learn it did not happen.
      - name: Check the signing configuration
        run: |
          missing() { echo "  missing: $1"; FAILED=1; }
          FAILED=0

          have_cert=0
          [ -n "$CERTIFICATE" ] || [ -n "$CERTIFICATE_PASSWORD" ] && have_cert=1

          have_notary=0
          [ -n "$NOTARY_KEY" ] || [ -n "$NOTARY_KEY_ID" ] || [ -n "$NOTARY_ISSUER" ] && have_notary=1

          if [ "$have_cert" = 0 ] && [ "$have_notary" = 0 ]; then
            echo "No signing secrets — building ad-hoc signed, as before."
            echo "The release notes will say the macOS builds are not notarised."
            exit 0
          fi

          if [ "$have_cert" = 1 ]; then
            echo "Signing configuration:"
            [ -n "$CERTIFICATE" ] || missing "MACOS_CERTIFICATE"
            [ -n "$CERTIFICATE_PASSWORD" ] || missing "MACOS_CERTIFICATE_PASSWORD"
          fi

          if [ "$have_notary" = 1 ]; then
            echo "Notarisation configuration:"
            [ -n "$NOTARY_KEY" ] || missing "APPLE_NOTARY_KEY"
            [ -n "$NOTARY_KEY_ID" ] || missing "APPLE_NOTARY_KEY_ID"
            [ -n "$NOTARY_ISSUER" ] || missing "APPLE_NOTARY_ISSUER"

            # Notarisation is Apple checking something signed with a Developer ID. There
            # is nothing to submit without one, and the notarise step would simply be
            # skipped — quietly producing the ad-hoc build the secrets were meant to avoid.
            [ "$have_cert" = 1 ] || missing "MACOS_CERTIFICATE (notarising needs a signed app)"
          fi

          if [ "$FAILED" = 1 ]; then
            echo
            echo "Set the rest, or none of them — half is the one case that cannot work."
            exit 1
          fi

          echo "  complete"

      # All of this degrades: with no certificate the build is ad-hoc signed exactly as it
      # was before any of it existed, and the release notes say so. Adding the secrets is
      # what turns signing on — no code change, no flag.
      - name: Import the signing certificate
        id: cert
        if: env.CERTIFICATE != ''
        run: |
          # A keychain of its own, unlocked only for this job, with a password nobody needs
          # to know because nothing outlives the runner.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt that nobody is there to answer,
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')"

          [ -n "$identity" ] || { echo "no Developer ID Application identity in the p12"; exit 1; }

          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signing as: $identity"

      # A bundle rather than the bare binary: it gets a Dock icon and a real app name, it
      # avoids the self-extraction pause a single-file build has on first run, and it is
      # what carries CFBundleURLTypes — without which cairn:// links do nothing.
      #
      # Both architectures, because Intel Macs are still out there and an arm64-only
      # download simply refuses to start on one.
      # No make-icons.sh here: the rendered icons are committed, and that script exists for
      # when the artwork changes. Re-rendering on every release would make the icon a build
      # output that depends on whatever the runner's qlmanage does today.
      - name: Build the app bundles
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          ./build-macos-app.sh osx-arm64
          ./build-macos-app.sh osx-x64

      # Signing gets past "unidentified developer"; only notarisation gets past the
      # quarantine warning on a downloaded file, and only stapling makes that work for
      # somebody whose first launch is offline.
      - name: Notarise and staple
        id: notarise
        if: steps.cert.outputs.identity != '' && env.NOTARY_KEY != ''
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"

          for arch in arm64 x64; do
            app="artifacts/osx-$arch/Cairn.app"

            # Submitted as a zip, and ditto for the same reason it is used to package:
            # anything that flattens the bundle produces a rejection about a malformed
            # archive rather than about the app.
            ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarize-$arch.zip"

            xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" \
              --wait --timeout 30m

            # Staples the ticket into the bundle, so Gatekeeper can check it without the
            # network. Done after notarisation and before packaging, or the archive people
            # download contains an unstapled app.
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          done

          rm -f "$RUNNER_TEMP/notary.p8"
          echo "done=true" >> "$GITHUB_OUTPUT"

      # ditto, not zip. A .app contains symlinks and extended attributes, and plain zip
      # quietly flattens them into a bundle macOS then calls damaged.
      - name: Package
        run: |
          mkdir -p dist
          for arch in arm64 x64; do
            ditto -c -k --sequesterRsrc --keepParent \
              "artifacts/osx-$arch/Cairn.app" \
              "dist/cairn-${GITHUB_REF_NAME#v}-macos-$arch.zip"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # Windows and Linux cross-publish from one runner: these are single-file binaries with
  # no platform tooling behind them, unlike the macOS bundle.
  cross:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: ./build-release.sh win-x64 linux-x64

      - name: Package
        run: |
          # Same rule as the macOS job: a manual run has no version, and the branch name
          # is not one.
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *)           version="0.0.0-$(git rev-parse --short HEAD)" ;;
          esac

          mkdir -p dist

          # The CLI ships alongside the launcher rather than separately: one download,
          # and the pair are only ever useful at the same version.
          tar -czf "dist/cairn-$version-linux-x64.tar.gz" \
            -C artifacts/linux-x64 cairn cairn-cli

          (cd artifacts/win-x64 && zip -q "../../dist/cairn-$version-windows-x64.zip" \
            cairn.exe cairn-cli.exe)

          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: cross
          path: dist/*

  # Object storage, so cairns.gg can offer a download rather than a link to a repository.
  # Separate from the GitHub release on purpose: that one is a draft somebody approves,
  # while these are immutable files at a versioned path that nothing points at until the
  # manifest moves.
  spaces:
    needs: [macos, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    env:
      SPACES_KEY: ${{ secrets.SPACES_KEY }}
      SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
      SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT }}
      SPACES_BUCKET: ${{ vars.SPACES_BUCKET }}
      SPACES_PUBLIC_URL: ${{ vars.SPACES_PUBLIC_URL }}

    steps:
      - uses: actions/download-artifact@v4
        if: env.SPACES_KEY != ''
        with:
          path: dist
          merge-multiple: true

      - name: Upload to Spaces
        if: env.SPACES_KEY != ''
        run: |
          version="${GITHUB_REF_NAME#v}"

          # Spaces speaks S3, so the preinstalled AWS CLI is the client. The region is not
          # meaningful to Spaces but the CLI insists on one, and the endpoint already
          # contains it — deriving it beats another variable to keep in step.
          export AWS_ACCESS_KEY_ID="$SPACES_KEY"
          export AWS_SECRET_ACCESS_KEY="$SPACES_SECRET"
          export AWS_DEFAULT_REGION="$(echo "$SPACES_ENDPOINT" | sed -E 's#https?://([^.]+)\..*#\1#')"

          public="${SPACES_PUBLIC_URL:-$SPACES_ENDPOINT/$SPACES_BUCKET}"
          public="${public%/}"

          cd dist

          # Named explicitly rather than `*`, which would depend on whether the glob is
          # expanded before the redirection creates the file it is writing to.
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS

          # A versioned path, and never overwritten. Somebody who linked a build a year ago
          # should still get that build, byte for byte — which also means these can be
          # cached forever, since the URL cannot come to mean something else.
          for f in *; do
            aws s3 cp "$f" "s3://$SPACES_BUCKET/releases/$version/$f" \
              --endpoint-url "$SPACES_ENDPOINT" \
              --acl public-read \
              --cache-control "public, max-age=31536000, immutable"
          done

          # What the site reads to know what to offer. Written last, so it never names a
          # file that is not up yet, and cached briefly rather than forever — it is the one
          # thing here that is meant to change.
          {
            echo "{"
            echo "  \"version\": \"$version\","
            echo "  \"publishedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"files\": ["
            first=1
            for f in *.zip *.tar.gz; do
              [ -e "$f" ] || continue
              platform="$(echo "$f" | sed -E "s/^cairn-$version-//; s/\.(zip|tar\.gz)$//")"
              [ $first = 1 ] || echo ","
              first=0
              printf '    {"platform": "%s", "name": "%s", "url": "%s", "size": %s, "sha256": "%s"}' \
                "$platform" "$f" "$public/releases/$version/$f" \
                "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "  ]"
            echo "}"
          } > latest.json

          cat latest.json

          aws s3 cp latest.json "s3://$SPACES_BUCKET/releases/latest.json" \
            --endpoint-url "$SPACES_ENDPOINT" \
            --acl public-read \
            --content-type application/json \
            --cache-control "public, max-age=300"

          echo "published $public/releases/$version/"

      - name: Say why nothing was uploaded
        if: env.SPACES_KEY == ''
        run: echo "SPACES_KEY is not set — skipping the upload to object storage."

  release:
    needs: [macos, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        env:
          NOTARISED: ${{ needs.macos.outputs.notarised }}
        run: |
          cat > notes.md <<'NOTES'
          ## Downloads

          | platform | file |
          |---|---|
          | macOS (Apple silicon) | `cairn-*-macos-arm64.zip` |
          | macOS (Intel) | `cairn-*-macos-x64.zip` |
          | Windows | `cairn-*-windows-x64.zip` |
          | Linux | `cairn-*-linux-x64.tar.gz` |

          Each contains the launcher; the Windows and Linux archives also contain
          `cairn-cli`. Nothing else needs installing — Cairn fetches the game and the
          .NET runtime itself.
          NOTES

          # Said by the build rather than by whoever writes the notes, because the two
          # drift: a release that quietly stopped being notarised while still claiming to
          # be would send people past a warning they should have taken seriously.
          if [ "$NOTARISED" = "true" ]; then
            cat >> notes.md <<'NOTES'

          The macOS builds are signed and notarised, so they open normally.
          NOTES
          else
            cat >> notes.md <<'NOTES'

          ### macOS: these builds are not notarised

          They are ad-hoc signed, so Gatekeeper refuses them on first open with "Cairn is
          damaged" or "cannot be opened because the developer cannot be verified":

          ```
          xattr -dr com.apple.quarantine /Applications/Cairn.app
          ```
          NOTES
          fi

          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist

          # A draft, deliberately. The macOS bundles are ad-hoc signed, so somebody has to
          # look at what is being shipped and decide it is acceptable. Publishing straight
          # to the world would make that decision by default, once, silently, forever.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
